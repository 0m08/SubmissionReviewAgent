# MCP Server Configuration
#
# This file defines MCP servers that can be connected to.
# Environment variables can be interpolated using ${VAR} or ${VAR:-default} syntax.
#
# Transport types:
#   - stdio: Local subprocess communication (requires: command, args)
#   - sse: Server-Sent Events over HTTP (requires: url) - deprecated
#   - streamable_http: HTTP POST with streaming (requires: url) - recommended for remote

servers:
