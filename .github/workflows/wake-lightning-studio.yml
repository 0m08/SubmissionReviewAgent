name: Keep Lightning Studio Awake

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_STUDIO_NAME: ${{ secrets.LIGHTNING_STUDIO_NAME }}
      LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
      LIGHTNING_USERNAME: ${{ secrets.LIGHTNING_USERNAME }}
      LIGHTNING_WAKE_MAX_WAIT_SECONDS: "300"
      LIGHTNING_WAKE_POLL_SECONDS: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lightning-sdk>=2025.7"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            LIGHTNING_API_KEY
            LIGHTNING_USER_ID
            LIGHTNING_STUDIO_NAME
            LIGHTNING_TEAMSPACE
            LIGHTNING_USERNAME
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required secret/env: ${var_name}"
              exit 1
            fi
          done

      - name: Check and wake Lightning Studio
        run: python services/check_lightningai_studio_status_and_wake_if_inactive.py
