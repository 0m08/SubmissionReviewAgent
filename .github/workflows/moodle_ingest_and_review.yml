name: 1. Moodle Ingest & Submission Review Pipeline

on:
  workflow_dispatch:
    inputs:
      activity_name:
        description: "Activity name to evaluate, or 'all' to process all activities from Activity Details tab"
        required: false
        default: "all"
        type: string
      assignment_url:
        description: "Moodle Assignment URL (optional; only needed when processing a single activity not in sheet)"
        required: false
        default: ""
        type: string
      primary_model:
        description: "Primary LLM for evaluation"
        required: false
        default: "gpt-5.6-luna"
        type: choice
        options:
          - "gpt-5.6-luna"
          - "gemini-3.5-flash"
      review_sheet_url:
        description: "Moodle Submission Review Sheet URL"
        required: false
        default: "https://docs.google.com/spreadsheets/d/1aP7Xdvoi4TTIT8K7X9j2wD0G6-YCnA7sEn-BiLDWWQU/edit?usp=sharing"
        type: string
      concurrency:
        description: "Concurrent worker threads for student AI reviews"
        required: false
        default: "10"
        type: string

  # Scheduled automated run: Everyday at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: moodle-ingest-review-pipeline
  cancel-in-progress: false

jobs:
  ingest_and_review:
    name: Ingest & Review Submissions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Moodle Credentials
      MOODLE_USER: ${{ secrets.MOODLE_USER }}
      MOODLE_PASS: ${{ secrets.MOODLE_PASS }}
      MOODLE_ASSIGNMENT_URL: ${{ github.event.inputs.assignment_url || secrets.MOODLE_ASSIGNMENT_URL || '' }}

      # Gmail IMAP Credentials for Adaptive MFA / OTP
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}

      # Google Drive User OAuth (om@skillcatapp.com)
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID || secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || secrets.OAUTH_CLIENT_SECRET }}
      OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN || secrets.OAUTH_REFRESH_TOKEN }}
      MOODLE_DRIVE_FOLDER_ID: ${{ secrets.MOODLE_DRIVE_FOLDER_ID || '1jR5JP3aTKt8u_X57Z31IS71ZGBX-zfeu' }}

      # AI Models
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: "moodle-submission-reviewer"

      # Playwright & Execution Flags
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/submission_reviewer/requirements-reviewer.txt

      - name: 🎭 Install Playwright Chromium with system dependencies
        run: |
          playwright install chromium --with-deps

      - name: 🚀 Run Ingestion & Review Pipeline (Syncs to Central Sheet)
        shell: bash
        run: |
          set -e

          # Construct runner command: --ingest is set, but --upload-moodle is deliberately omitted
          CMD="python -m agents.submission_reviewer.moodle_review_runner --ingest"

          # Activity Name: defaults to 'all' to process all activities from Activity Details tab
          ACTIVITY="${{ github.event.inputs.activity_name || 'all' }}"
          CMD="$CMD --activity-name \"$ACTIVITY\""

          # Model choice
          MODEL="${{ github.event.inputs.primary_model || 'gpt-5.6-luna' }}"
          CMD="$CMD --model \"$MODEL\""

          # Moodle Submission Review Sheet (Activity Details tab & target activity tab)
          REVIEW_SHEET="${{ github.event.inputs.review_sheet_url || 'https://docs.google.com/spreadsheets/d/1aP7Xdvoi4TTIT8K7X9j2wD0G6-YCnA7sEn-BiLDWWQU/edit?usp=sharing' }}"
          CMD="$CMD --review-sheet \"$REVIEW_SHEET\""

          CONCURRENCY="${{ github.event.inputs.concurrency || '10' }}"
          CMD="$CMD --concurrency \"$CONCURRENCY\""

          echo "Executing: $CMD"
          eval $CMD

      - name: 💾 Archive Run Artifacts (Grading Worksheet & Downloads)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moodle-review-artifacts-${{ github.run_id }}
          path: |
            downloads/moodle_submissions/
            ./MyDrive/Moodle_Automated_Downloads/
          retention-days: 7
